<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Dashboard - EARS</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="employee-dashboard-layout">

        <aside class="sidebar">
            <div class="sidebar-header">
<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <circle cx="60" cy="60" r="55" fill="#2563EB"/>
  <path d="M40 40L80 40L80 80L40 80Z" stroke="white" stroke-width="6" fill="none"/>
  <path d="M50 50V70H70V50H50Z" fill="white"/>
  <path d="M30 30L90 30M30 90L90 90" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <text x="60" y="105" font-family="Arial" font-size="14" font-weight="bold" fill="white" text-anchor="middle">EARS</text>
</svg>
            </div>
            <nav class="sidebar-nav">
                <ul>
        <li class="active dashboard">
            <button class="nav-button" data-page="Home.html"><i class="fa-solid fa-table-columns"></i> Dashboard</button>
        </li>
        <li class="profile">
            <button class="nav-button" data-page="EProfile.html"><i class="fa-solid fa-user"></i> Profile</button>
        </li>
        <li class="training-modules">
            <button class="nav-button" data-page="training-modules.html"><i class="fa-solid fa-book-open"></i> Training Modules</button>
        </li>
        <li class="support">
            <button  class="nav-button" data-page="Support.html"><i class="fa-solid fa-headset"></i> Support</button>
        </li>
                </ul>
            </nav>
        </aside>

        <div class="main-content-area">
            <header class="main-header">
                <div class="search-bar">
                </div>
                <div class="user-info">
                     <i class="fa-regular fa-bell notification-icon"></i>
                    <span id="user-role">Employee</span>
                    <i class="fa-regular fa-circle-user user-icon"></i>
                    <button id="logout-button">Logout</button>
                </div>
            </header>

            <main class="content">
                
            </main>
        </div>
    </div>

<!-- LOADER -->
    <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner">
        <div class="spinner"></div>
        <p class="loading-text">Loading...</p>
    </div>
    </div>
        <div id="notificationContainer" class="notification-container"></div>
<script type="module" src="public.js"></script>
<script type="module" src="logout.js"></script>
</body>
</html>
