<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Dashboard - EARS</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="employee-dashboard-layout">

        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="../assets/ears-logo.png" alt="EARS Logo" class="logo">
                <h2>EARS</h2>
            </div>
            <nav class="sidebar-nav">
                <ul>
        <li class="active dashboard">
            <button class="nav-button" data-page="Home.html"><i class="fa-solid fa-table-columns"></i> Dashboard</button>
        </li>
        <li class="profile">
            <button class="nav-button" data-page="EProfile.html"><i class="fa-solid fa-user"></i> Profile</button>
        </li>
        <li class="training-modules">
            <button class="nav-button" data-page="training-modules.html"><i class="fa-solid fa-book-open"></i> Training Modules</button>
        </li>
        <li class="progress">
            <button class="nav-button" data-page="Progress.html"><i class="fa-solid fa-chart-line"></i> Progress</button>
        </li>
        <li class="support">
            <button class="nav-button" data-page="Support.html"><i class="fa-solid fa-headset"></i> Support</button>
        </li>
                </ul>
            </nav>
        </aside>

        <div class="main-content-area">
            <header class="main-header">
                <div class="search-bar">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="search" placeholder="Search training modules and assessments">
                </div>
                <div class="user-info">
                     <i class="fa-regular fa-bell notification-icon"></i>
                    <span id="user-role">Employee</span>
                    <i class="fa-regular fa-circle-user user-icon"></i>
                    <button id="logout-button">Logout</button>
                </div>
            </header>

<main class="content">
    <div class="welcome-banner">
        <h1>Welcome, <span class="user-name">John</span></h1>
        <p class="user-progress">You've completed <span class="completed-count">6</span> of <span class="total-modules">12</span> modules</p>
    </div>

    <div class="dashboard-sections">
        <!-- Current Progress Section -->
        <section class="dashboard-section progress-section">
            <h2><i class="fas fa-chart-line"></i> Your Progress</h2>
            <div class="progress-circles">
                <div class="progress-circle">
                    <div class="circle" style="--percent:60">
                        <span>60%</span>
                    </div>
                    <p>Overall Completion</p>
                </div>
                <div class="progress-circle">
                    <div class="circle" style="--percent:40">
                        <span>40%</span>
                    </div>
                    <p>Avg Quiz Score</p>
                </div>
            </div>
        </section>

        <!-- Active Courses Section -->
        <section class="dashboard-section courses-section">
            <h2><i class="fas fa-book-open"></i> Your Courses</h2>
            <div class="course-cards">
                <div class="course-card">
                    <h3>Introduction to Psychology</h3>
                    <div class="progress-bar">
                        <div class="progress" style="width: 60%"></div>
                    </div>
                    <div class="course-stats">
                        <span><i class="fas fa-check"></i> 4/6 modules</span>
                        <span><i class="fas fa-star"></i> 2/3 quizzes</span>
                    </div>
                    <button class="continue-btn">Continue</button>
                </div>
                <div class="course-card">
                    <h3>Introduction to Computer Science</h3>
                    <div class="progress-bar">
                        <div class="progress" style="width: 30%"></div>
                    </div>
                    <div class="course-stats">
                        <span><i class="fas fa-check"></i> 2/5 modules</span>
                        <span><i class="fas fa-star"></i> 1/2 quizzes</span>
                    </div>
                    <button class="continue-btn">Continue</button>
                </div>
            </div>
        </section>

        <!-- Quick Actions Section -->
        <section class="dashboard-section actions-section">
            <h2><i class="fas fa-bolt"></i> Quick Actions</h2>
            <div class="action-buttons">
                <button class="action-btn">
                    <i class="fas fa-play"></i>
                    <span>Continue Learning</span>
                </button>
                <button class="action-btn">
                    <i class="fas fa-question-circle"></i>
                    <span>Take a Quiz</span>
                </button>
                <button class="action-btn">
                    <i class="fas fa-search"></i>
                    <span>Find Courses</span>
                </button>
                <button class="action-btn">
                    <i class="fas fa-trophy"></i>
                    <span>View Achievements</span>
                </button>
            </div>
        </section>
    </div>
</main>
        </div>
    </div>
<script type="module" src="public.js"></script>
<script type="module" src="logout.js"></script>
</body>
</html>
