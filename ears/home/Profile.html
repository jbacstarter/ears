<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>User Profile - EARS</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />
</head>
<body>
  <div class="employee-dashboard-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <img src="../assets/ears-logo.png" alt="EARS Logo" class="logo" />
        <h2>EARS</h2>
      </div>
      <nav class="sidebar-nav">
        <ul>
        <li>
            <button class="nav-button dashboard"  data-page="Home.html"><i class="fa-solid fa-table-columns"></i> Dashboard</button>
        </li>
        <li  class="active">
            <button class="nav-button profile" data-page="EProfile.html"><i class="fa-solid fa-user"></i> Profile</button>
        </li>
        <li>
            <button class="nav-button training-modules" data-page="training-modules.html"><i class="fa-solid fa-book-open"></i> Training Modules</button>
        </li>
        <li>
            <button class="nav-button assessments" data-page="Assessments.html"><i class="fa-solid fa-puzzle-piece"></i> Assessments</button>
        </li>
        <li>
            <button class="nav-button progress" data-page="Progress.html"><i class="fa-solid fa-chart-line"></i> Progress</button>
        </li>
        <li>
            <button class="nav-button support" data-page="Support.html"><i class="fa-solid fa-headset"></i> Support</button>
        </li>
        </ul>
      </nav>
    </aside>

    <div class="main-content-area">
      <header class="main-header">
        <div class="search-bar">
          <i class="fa-solid fa-magnifying-glass search-icon"></i>
          <input type="search" placeholder="Search training modules and assessments" />
        </div>
        <div class="user-info">
          <i class="fa-regular fa-bell notification-icon"></i>
          <span id="user-role">Employee</span>
          <i class="fa-regular fa-circle-user user-icon"></i>
          <button id="logout-button">Logout</button>
        </div>
      </header>

<main class="quiz-container">
  <div class="quiz-header">
    <h1>Workplace Safety Assessment</h1>
    <div class="quiz-meta">
      <span class="quiz-timer"><i class="fas fa-clock"></i> Time remaining: <span id="time-display">25:00</span></span>
      <span class="quiz-progress">10 Questions</span>
    </div>
  </div>

  <div class="quiz-questions">
    <!-- Question 1 -->
    <div class="quiz-question">
      <div class="question-header">
        <h2>Question 1</h2>
        <button class="flag-button"><i class="far fa-flag"></i></button>
      </div>
      <div class="question-text">
        <p>Which of the following is the correct procedure when discovering a fire in the workplace?</p>
      </div>
      <div class="answer-options">  
        <div class="answer-option">
          <input type="radio" id="q1-option1" name="q1" class="answer-radio">
          <label for="q1-option1" class="answer-label">
            <span class="option-letter">A</span>
            <span class="option-text">Attempt to put out the fire yourself immediately</span>
          </label>
        </div>
        <div class="answer-option">
          <input type="radio" id="q1-option2" name="q1" class="answer-radio">
          <label for="q1-option2" class="answer-label">
            <span class="option-letter">B</span>
            <span class="option-text">Activate the nearest fire alarm and evacuate</span>
          </label>
        </div>
        <div class="answer-option">
          <input type="radio" id="q1-option3" name="q1" class="answer-radio">
          <label for="q1-option3" class="answer-label">
            <span class="option-letter">C</span>
            <span class="option-text">Continue working until instructed otherwise</span>
          </label>
        </div>
        <div class="answer-option">
          <input type="radio" id="q1-option4" name="q1" class="answer-radio">
          <label for="q1-option4" class="answer-label">
            <span class="option-letter">D</span>
            <span class="option-text">Call your supervisor and wait for instructions</span>
          </label>
        </div>
      </div>
    </div>

    <!-- Additional questions would follow the same pattern -->
    
  </div>

  <div class="quiz-footer">
    <button class="submit-button">
      Submit Assessment
    </button>
  </div>
</main>

    </div>
  </div> 
<script type="module" src="General.js"></script>
</body>
</html>
